name: Install Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# External published installer check, not a build of this PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      - name: Run external installer docker tests
        timeout-minutes: 12
        env:
          CLAWDBOT_INSTALL_URL: https://clawd.bot/install.sh
          CLAWDBOT_INSTALL_CLI_URL: https://clawd.bot/install-cli.sh
          CLAWDBOT_NO_ONBOARD: "1"
          CLAWDBOT_INSTALL_SMOKE_SKIP_CLI: "1"
          CLAWDBOT_INSTALL_SMOKE_SKIP_NONROOT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          CLAWDBOT_INSTALL_SMOKE_SKIP_PREVIOUS: "1"
        run: |
          set -o pipefail
          mkdir -p smoke-results
          bash scripts/test-install-sh-docker.sh 2>&1 | tee smoke-results/install.log

      - name: Retain installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-installer-diagnostics
          path: smoke-results
          if-no-files-found: warn
