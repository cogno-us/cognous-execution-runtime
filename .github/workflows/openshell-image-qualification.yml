# Cross-component suite delegated to its canonical testing repository.
name: OpenShell worker image qualification
'on':
  pull_request:
    paths:
    - engine/openshell_worker.py
    - engine/openshell_environment.py
    - engine/safe_executor.py
    - examples/openshell/**
    - tests/test_openshell_worker_contract.py
    - tools/openshell_image_qualification.py
    - docs/workstreams/openshell-image-qualification-checkpoint.md
    - .github/workflows/openshell-image-qualification.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-execution-runtime--openshell-image-qualification.yml@43fb81dc3ec0da17402bef274dcec1831cc5e160
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 43fb81dc3ec0da17402bef274dcec1831cc5e160
    permissions:
      contents: read
