name: Late invoke regression qualification
on:
  pull_request:
    paths:
      - 'src/gateway/server.nodes.late-invoke.test.ts'
      - '.github/workflows/late-invoke-qualification.yml'
permissions:
  contents: read
concurrency:
  group: late-invoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [pnpm exec, bunx]
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.23.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Frozen install
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      - name: Build required canvas assets
        timeout-minutes: 3
        run: pnpm canvas:a2ui:bundle
      - name: Late invoke behavior in isolation
        timeout-minutes: 3
        run: ${{ matrix.runner }} vitest run --config vitest.config.ts src/gateway/server.nodes.late-invoke.test.ts --maxWorkers=1 --reporter=verbose
      - name: Original full shard without retries or exclusions
        timeout-minutes: 8
        run: ${{ matrix.runner }} vitest run --config vitest.config.ts --shard=1/4 --maxWorkers=2
