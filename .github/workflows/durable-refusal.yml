# Cross-component suite delegated to its canonical testing repository.
name: Durable refusal capture
'on':
  pull_request:
    paths:
    - engine/**
    - tests/test_refusal_capture.py
    - .github/workflows/durable-refusal.yml
  push:
    branches:
    - main
    paths:
    - engine/**
    - tests/test_refusal_capture.py
    - .github/workflows/durable-refusal.yml
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-execution-runtime--durable-refusal.yml@43fb81dc3ec0da17402bef274dcec1831cc5e160
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 43fb81dc3ec0da17402bef274dcec1831cc5e160
    permissions:
      contents: read
