# Cross-component suite delegated to its canonical testing repository.
name: OpenAPPA local host resume
'on':
  pull_request:
    paths:
    - tools/openappa/local_resume.py
    - tools/openappa/test_local_resume.py
    - tools/openappa/cognous_local_resume_main.rs
    - tools/openappa/cognous_trajectory_contract.rs
    - .github/workflows/openappa-local-resume.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-execution-runtime--openappa-local-resume.yml@fba734edb12bfc7e73a313a1d156876146eebe0a
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: fba734edb12bfc7e73a313a1d156876146eebe0a
    permissions:
      contents: read
