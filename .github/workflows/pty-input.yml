name: PTY input regression

on:
  pull_request:
    paths:
      - "src/agents/bash-tools*"
      - "src/agents/bash-process-registry*"
      - "src/agents/pty-*"
      - "src/agents/shell-utils*"
      - ".github/workflows/pty-input.yml"
  push:
    branches: [main]
    paths:
      - "src/agents/bash-tools*"
      - "src/agents/bash-process-registry*"
      - "src/agents/pty-*"
      - "src/agents/shell-utils*"
      - ".github/workflows/pty-input.yml"

permissions:
  contents: read

jobs:
  pty-input:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true
      - name: Check formatting and lint
        run: |
          pnpm exec oxfmt --check src/agents/bash-tools.process.send-keys.test.ts
          pnpm exec oxlint src/agents/bash-tools.process.send-keys.test.ts
      - name: Exercise PTY input repeatedly
        run: |
          for attempt in 1 2 3 4 5; do
            pnpm exec vitest run --config vitest.config.ts --maxWorkers=1 src/agents/bash-tools.process.send-keys.test.ts src/agents/bash-tools.exec.pty.test.ts src/agents/bash-tools.exec.pty-fallback.test.ts src/agents/pty-keys.test.ts
          done
