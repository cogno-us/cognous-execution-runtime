name: Focused sharp restart
on:
  push:
    branches: [governor/qualify-sharp]
permissions:
  contents: read
concurrency:
  group: focused-sharp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.23.0'
      - name: Frozen install
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      - name: Type check
        timeout-minutes: 4
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Image pipeline and image tool tests
        timeout-minutes: 4
        run: pnpm exec vitest run --config vitest.config.ts src/media/image-ops.native.test.ts src/agents/tools/image-tool.test.ts --maxWorkers=1
