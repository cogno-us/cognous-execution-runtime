# Cross-component suite delegated to its canonical testing repository.
name: Live OpenShell readiness
'on':
  pull_request:
    paths:
    - tools/live_openshell_readiness.py
    - tests/test_live_openshell_readiness.py
    - docs/workstreams/live-openshell-readiness-results.json
    - docs/workstreams/live-openshell-qualification-checkpoint.md
    - docs/workstreams/live-openshell-evidence-index.json
    - .github/workflows/live-openshell-readiness.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-execution-runtime--live-openshell-readiness.yml@f99bb7591f52ca5a26d64a50d9ef466b4749ad4e
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: f99bb7591f52ca5a26d64a50d9ef466b4749ad4e
    permissions:
      contents: read
