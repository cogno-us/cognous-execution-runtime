name: Dependency guard application validation
on:
  pull_request:
    paths:
      - 'tools/dependency_restart_preflight.py'
      - 'tools/tests/test_dependency_restart_preflight.py'
      - '.github/workflows/dependency-restart.yml'
      - '.github/workflows/dependency-guard-application.yml'
      - 'docs/workstreams/dependency-restart-vitest.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-guard-application-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  application-gate:
    name: Required Linux ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: [lint, build, test]
    env:
      CI: 'true'
      CLAWDBOT_TEST_WORKERS: '2'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Use repository package manager
        timeout-minutes: 2
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          pnpm --version
      - name: Frozen application installation
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile
      - name: Run actual repository gate
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-evidence
          git rev-parse HEAD > gate-evidence/source.txt
          sha256sum package.json ui/package.json pnpm-lock.yaml > gate-evidence/manifests.txt
          pnpm ${{ matrix.task }} 2>&1 | tee gate-evidence/${{ matrix.task }}.log
      - name: Retain executed gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-guard-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-evidence/
          if-no-files-found: warn
          retention-days: 14
  application-gates-complete:
    needs: application-gate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all three commands to succeed
        env:
          RESULT: ${{ needs.application-gate.result }}
        run: test "$RESULT" = success
