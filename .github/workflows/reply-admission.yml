name: Optional reply admission
on:
  pull_request:
    paths:
      - 'src/auto-reply/reply/reply-admission.ts'
      - 'src/auto-reply/reply/reply-admission.test.ts'
      - 'src/auto-reply/reply/reply-dispatcher.ts'
      - 'src/auto-reply/reply/reply-routing.test.ts'
      - 'src/auto-reply/reply/normalize-reply.ts'
      - '.github/workflows/reply-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true
      - name: Type check
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Verify actual dispatcher boundary and unchanged default behavior
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm exec vitest run src/auto-reply/reply/reply-admission.test.ts src/auto-reply/reply/reply-routing.test.ts --maxWorkers=1 --reporter=default --reporter=junit --outputFile=reply-admission.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('reply-admission.xml').getroot().findall('.//testcase')
          assert len(cases) == 41, len(cases)
          assert all(not any(c.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for c in cases)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reply-admission-results
          path: reply-admission.xml
          if-no-files-found: error
