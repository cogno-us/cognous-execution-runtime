name: Gateway tests - windows
on:
  push:
    branches: [governor/gateway-timeout-diagnosis]
    paths:
      - ".github/workflows/gateway-test-windows.yml"
      - "src/**"
      - "test/**"
      - "vitest*.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gateway-test-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gateway-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install frozen dependencies
        timeout-minutes: 8
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          pnpm install --frozen-lockfile --config.engine-strict=false
      - name: Run gateway HTTP tests
        timeout-minutes: 4
        run: |
          set -o pipefail
          mkdir -p diagnostic-results
          pnpm exec vitest run src/gateway/tools-invoke-http.test.ts --maxWorkers=1 --reporter=verbose 2>&1 | tee diagnostic-results/gateway.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-diagnostic-windows
          path: diagnostic-results
