# Cross-component suite delegated to its canonical testing repository.
name: OpenAPPA actual reply admission
'on':
  pull_request:
    paths:
    - tools/openappa/cognous_reply_admission_main.rs
    - tools/openappa/cognous_trajectory_contract.rs
    - src/auto-reply/reply/reply-admission.ts
    - src/auto-reply/reply/reply-admission.test.ts
    - src/auto-reply/reply/reply-admission.openappa.test.ts
    - src/auto-reply/reply/reply-dispatcher.ts
    - src/auto-reply/reply/reply-routing.test.ts
    - src/auto-reply/reply/normalize-reply.ts
    - .github/workflows/openappa-reply-admission.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-execution-runtime--openappa-reply-admission.yml@39f038435afdd71ba162860faa5718d90d7bde64
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 39f038435afdd71ba162860faa5718d90d7bde64
    permissions:
      contents: read
