name: OpenAPPA actual reply admission
on:
  pull_request:
    paths:
      - 'tools/openappa/cognous_reply_admission_main.rs'
      - 'tools/openappa/cognous_trajectory_contract.rs'
      - 'src/auto-reply/reply/reply-admission.ts'
      - 'src/auto-reply/reply/reply-admission.test.ts'
      - 'src/auto-reply/reply/reply-admission.openappa.test.ts'
      - 'src/auto-reply/reply/reply-dispatcher.ts'
      - 'src/auto-reply/reply/reply-routing.test.ts'
      - 'src/auto-reply/reply/normalize-reply.ts'
      - '.github/workflows/openappa-reply-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: archestra-ai/OpenAPPA
          ref: 10aa0e09e32d8c6704bdb030dc3c66140bf81915
          path: pinned/openappa
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build actual pinned policy probe
        run: |
          set -euo pipefail
          test "$(git -C pinned/openappa rev-parse HEAD)" = 10aa0e09e32d8c6704bdb030dc3c66140bf81915
          rustup toolchain install stable --profile minimal
          cat tools/openappa/cognous_trajectory_contract.rs tools/openappa/cognous_reply_admission_main.rs > pinned/openappa/appa-runtime/examples/cognous_reply_admission.rs
          cd pinned/openappa
          cargo +stable build --locked -p appa --no-default-features --example cognous_reply_admission
      - name: Install pinned Node dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true
      - name: Check types and actual dispatcher decisions
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          export COGNOUS_OPENAPPA_REPLY_PROBE="$GITHUB_WORKSPACE/pinned/openappa/target/debug/examples/cognous_reply_admission"
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm exec vitest run src/auto-reply/reply/reply-admission.test.ts src/auto-reply/reply/reply-routing.test.ts src/auto-reply/reply/reply-admission.openappa.test.ts --maxWorkers=1 --reporter=default --reporter=junit --outputFile=openappa-reply-admission.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('openappa-reply-admission.xml').getroot().findall('.//testcase')
          assert len(cases) == 48, len(cases)
          assert all(not any(c.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for c in cases)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openappa-reply-admission-results
          path: openappa-reply-admission.xml
          if-no-files-found: error
