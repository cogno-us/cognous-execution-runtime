# Cross-component suite delegated to its canonical testing repository.
name: OpenAPPA pinned embedded runtime
'on':
  pull_request:
    paths:
    - tools/openappa/cognous_embedded_contract.rs
    - .github/workflows/openappa-embedded-runtime.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-execution-runtime--openappa-embedded-runtime.yml@e5a7989bbc58007fdb448f0b1ac780955cde6475
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: e5a7989bbc58007fdb448f0b1ac780955cde6475
    permissions:
      contents: read
