name: Dependency restart preflight
on:
  pull_request:
    paths:
      - 'package.json'
      - 'ui/package.json'
      - 'pnpm-lock.yaml'
      - 'tools/dependency_restart_preflight.py'
      - 'tools/tests/test_dependency_restart_preflight.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/dependency-restart.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-restart-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  preflight-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        batch: [root, ui, graph]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static parser only
        timeout-minutes: 1
        run: python -m pip install PyYAML==6.0.3
      - name: Check selected batch
        timeout-minutes: 1
        run: python tools/dependency_restart_preflight.py ${{ matrix.batch }}

  regressions-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static parser only
        timeout-minutes: 1
        run: python -m pip install PyYAML==6.0.3
      - name: Reject incomplete upgrades
        timeout-minutes: 1
        run: python -m unittest discover -s tools/tests -p test_dependency_restart_preflight.py -v
