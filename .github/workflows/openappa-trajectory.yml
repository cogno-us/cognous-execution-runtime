# Cross-component suite delegated to its canonical testing repository.
name: OpenAPPA persistent trajectory qualification
'on':
  pull_request:
    paths:
    - tools/openappa/cognous_trajectory_contract.rs
    - .github/workflows/openappa-trajectory.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-execution-runtime--openappa-trajectory.yml@f99bb7591f52ca5a26d64a50d9ef466b4749ad4e
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: f99bb7591f52ca5a26d64a50d9ef466b4749ad4e
    permissions:
      contents: read
