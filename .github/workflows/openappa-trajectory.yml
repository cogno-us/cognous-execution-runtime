# Cross-component suite delegated to its canonical testing repository.
name: OpenAPPA persistent trajectory qualification
'on':
  pull_request:
    paths:
    - tools/openappa/cognous_trajectory_contract.rs
    - .github/workflows/openappa-trajectory.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-execution-runtime--openappa-trajectory.yml@43fb81dc3ec0da17402bef274dcec1831cc5e160
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 43fb81dc3ec0da17402bef274dcec1831cc5e160
    permissions:
      contents: read
