# Cross-component suite delegated to its canonical testing repository.
name: OpenAPPA persistent trajectory qualification
'on':
  pull_request:
    paths:
    - tools/openappa/cognous_trajectory_contract.rs
    - .github/workflows/openappa-trajectory.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-execution-runtime--openappa-trajectory.yml@1c1755ff4ea719cfa12f72bcd8c81dd51cff7fb2
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 1c1755ff4ea719cfa12f72bcd8c81dd51cff7fb2
    permissions:
      contents: read
