# Cross-component suite delegated to its canonical testing repository.
name: OpenAPPA synthetic authority conjunction
'on':
  pull_request:
    paths:
    - tools/openappa/**
    - engine/control_plane_adapter.py
    - engine/safe_executor.py
    - .github/workflows/openappa-conjunction.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-execution-runtime--openappa-conjunction.yml@2adc1103dddfa54fde52f44dec0d7e7901fb710e
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 2adc1103dddfa54fde52f44dec0d7e7901fb710e
    permissions:
      contents: read
