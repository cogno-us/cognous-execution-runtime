# Cross-component suite delegated to its canonical testing repository.
name: OpenAPPA pinned wire fixtures
'on':
  pull_request:
    paths:
    - tools/openappa/**
    - tests/fixtures/openappa/**
    - tests/test_openappa_fixture_contract.py
    - .github/workflows/openappa-wire-fixtures.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-execution-runtime--openappa-wire-fixtures.yml@2adc1103dddfa54fde52f44dec0d7e7901fb710e
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 2adc1103dddfa54fde52f44dec0d7e7901fb710e
    permissions:
      contents: read
