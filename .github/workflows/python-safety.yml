# Cross-component suite delegated to its canonical testing repository.
name: Python safety boundary
'on':
  push:
    paths:
    - engine/**
    - host/**
    - examples/openshell/**
    - docs/openshell-adapter.md
    - tests/**
    - docs/execution-boundary.md
    - docs/control-plane-interface-gap.md
    - .github/workflows/python-safety.yml
  pull_request:
    paths:
    - engine/**
    - host/**
    - examples/openshell/**
    - docs/openshell-adapter.md
    - tests/**
    - docs/execution-boundary.md
    - docs/control-plane-interface-gap.md
    - .github/workflows/python-safety.yml
permissions:
  contents: read
jobs:
  native:
    name: Component-local checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install --require-hashes -r .github/locks/pydantic-pytest-f8aeba.txt
    - run: python -m pytest -q tests
      env:
        PYTHONPATH: .:src
        PYTHONDONTWRITEBYTECODE: '1'
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-execution-runtime--python-safety.yml@1c1755ff4ea719cfa12f72bcd8c81dd51cff7fb2
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 1c1755ff4ea719cfa12f72bcd8c81dd51cff7fb2
    permissions:
      contents: read
