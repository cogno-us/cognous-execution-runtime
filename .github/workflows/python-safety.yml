name: Python safety boundary

on:
  push:
    paths:
      - "engine/**"
      - "examples/openshell/**"
      - "docs/openshell-adapter.md"
      - "tests/**"
      - "docs/execution-boundary.md"
      - "docs/control-plane-interface-gap.md"
      - ".github/workflows/python-safety.yml"
  pull_request:
    paths:
      - "engine/**"
      - "examples/openshell/**"
      - "docs/openshell-adapter.md"
      - "tests/**"
      - "docs/execution-boundary.md"
      - "docs/control-plane-interface-gap.md"
      - ".github/workflows/python-safety.yml"

permissions:
  contents: read

concurrency:
  group: python-safety-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Moltbot Safe
        uses: actions/checkout@v4

      - name: Checkout pinned Control Plane
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-control-plane
          ref: 2ea9528eeb87e14ff10f05de06473122b9df540f
          path: pinned/control-plane

      - name: Checkout pinned Action Manifest
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-action-manifest
          ref: 46c950bed37fe3812000895430bc0312d29e37ce
          path: pinned/action-manifest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install pytest==8.3.5 pydantic==2.11.9

      - name: Verify pinned revisions
        run: |
          test "$(git -C pinned/control-plane rev-parse HEAD)" = "2ea9528eeb87e14ff10f05de06473122b9df540f"
          test "$(git -C pinned/action-manifest rev-parse HEAD)" = "46c950bed37fe3812000895430bc0312d29e37ce"

      - name: Run Python safety and pinned integration tests
        env:
          PYTHONPATH: ".:pinned/control-plane/src"
          MOLTBOT_SAFE_CONTROL_PLANE_ROOT: "pinned/control-plane"
          MOLTBOT_SAFE_MANIFEST_FIXTURE: "pinned/action-manifest/examples/refund_integration_v1_1.manifest.json"
        run: pytest -q tests

      - name: Compile optional OpenShell helpers
        run: python -m compileall -q engine examples/openshell
